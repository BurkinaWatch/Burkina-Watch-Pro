services:
  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    container_name: burkinawatch-phase8-2-mediamtx
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:8889:8889"
    volumes:
      - ./mediamtx/phase8-2.yml:/mediamtx.yml:ro
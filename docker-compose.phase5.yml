services:
  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    container_name: burkinawatch-phase5-mediamtx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8554:8554"
      - "9997:9997"
      - "8889:8889"
    volumes:
      - ./mediamtx/phase5.yml:/mediamtx.yml:ro
# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install --global npm@10.9.9"]

[phases.install]
cmds = ["npm ci --omit=dev --ignore-scripts --no-audit --no-fund"]

[phases.build]
cmds = ["NODE_ENV=production npm run build"]

[start]
cmd = "npm run start"

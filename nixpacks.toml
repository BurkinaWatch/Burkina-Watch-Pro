# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["npm install --global npm@10.8.2"]

[phases.install]
cmds = ["NODE_ENV=development NPM_CONFIG_PRODUCTION=false npm ci --include=dev --ignore-scripts"]

[phases.build]
cmds = ["NODE_ENV=development NPM_CONFIG_PRODUCTION=false npm run build"]

[start]
cmd = "npm run start"

[variables]
NPM_CONFIG_PRODUCTION = "false"

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/mobile/revoke-all:
    post:
      operationId: revokeAllMobileSessions
      tags: [auth]
      summary: Revoke all active mobile sessions for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active mobile refresh tokens were revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeMobileSessionsResponse"
        "401":
          description: Authentication required
  /auth/mobile/sessions:
    get:
      operationId: getMobileSessions
      tags: [auth]
      summary: List active mobile sessions for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active mobile session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSessionsResponse"
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RevokeMobileSessionsResponse:
      type: object
      properties:
        success:
          type: boolean
        revokedCount:
          type: integer
      required:
        - success
        - revokedCount
    MobileSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque session identifier, not a credential
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        device:
          type: string
        browser:
          type: string
      required:
        - id
        - createdAt
        - expiresAt
        - device
        - browser
    MobileSessionsResponse:
      type: object
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/MobileSession"
      required:
        - sessions


logLevel: info

api: yes
# The compose file binds this port to loopback on the host. A production
# deployment must place the admin API on a private control-plane network.
apiAddress: 0.0.0.0:9997

rtsp: yes
rtspAddress: :8554

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: http://localhost:5000
apiAllowOrigin: http://localhost:5000

# MediaMTX asks the Express control plane before serving a reader. The
# callback accepts only short-lived Phase 5 grants in test mode.
authMethod: http
authHTTPAddress: http://host.docker.internal:5000/api/surveillance/media-auth

paths:
  phase5-test:
    source: publisher
  all_others:
    source: publisher